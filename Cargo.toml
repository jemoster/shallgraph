[workspace]
resolver = "2"
members = [
    "crates/shallgraph-core",
    "crates/shallgraph",
    "crates/shallgraph-macros",
    "crates/shallgraph-wasm",
    "sample_projects/rust",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.9.0"

[workspace.dependencies]
shallgraph-core = { path = "crates/shallgraph-core", default-features = false }
shallgraph-macros = { path = "crates/shallgraph-macros" }
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "visit", "parsing"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
walkdir = "2"
regex = "1"
indexmap = "=2.7.1"
pulldown-cmark = { version = "=0.12.2", default-features = false, features = ["html"] }
clap = { version = "=4.5.23", features = ["derive"] }
anyhow = "1"
