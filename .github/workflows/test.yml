# GRD-DEVOPS-001: Run npm tests on pull requests. Results appear as status checks on the PR.
name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: bash ./scripts/install-wasm-bindgen.sh
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # GRD-DEVOPS-002: same package step as the release workflow; catches packaging regressions on PRs.
      - name: Package VSCode extension
        run: npm run package -w shallgraph-vscode
      - name: Run tests
        run: npm test
      - name: Run visual regression tests
        run: npm run test:visual

  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.83.0
      - name: Run cargo tests
        run: cargo test --workspace
      # GRD-CLI-009: same native-binary package step as the release workflow; catches packaging regressions on PRs.
      - name: Package native Linux CLI binary
        run: bash ./scripts/package-native-cli.sh
      - name: Upload native Linux CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: shallgraph-linux-x86_64
          path: release/shallgraph-linux-x86_64
          if-no-files-found: error
