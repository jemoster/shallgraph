id: FR-FE-002
title: Latency Threshold
require: The UI shall maintain a glass-to-glass latency of less than 500ms for live monitoring.
attributes:
  rationale: |
    High latency renders live monitoring ineffective for security personnel 
    attempting to respond to real-time events.
  status: active
tags:
