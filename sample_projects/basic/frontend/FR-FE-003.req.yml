id: FR-FE-003
title: MFA Login
require: The frontend shall require Multi-Factor Authentication (MFA) via TOTP for all administrative accounts.
attributes:
  rationale: |
    Prevents unauthorized access to camera feeds even in the event of password 
    compromise, protecting the integrity of the secure stream.
  status: active
tags:
  priority: high
  component: frontend
  concern: [security]
links:
  - satisfies: SYS-001
