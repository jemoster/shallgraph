id: FR-BE-002
title: Audit Logging
require: The backend shall log all camera access attempts (timestamp, UserID, IP) to a read-only audit trail.
attributes:
  rationale: |
    Necessary for forensic analysis and compliance audits to verify who 
    accessed which feed and when.
  status: active
tags:
  priority: high
  component: backend
  concern: [privacy, security]
links:
  - satisfies: SYS-001
