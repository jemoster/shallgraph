id: SYS-002
title: Multi-Stream Support
require: The backend shall support concurrent streaming of up to {{:max_streams}} high-definition (1080p) feeds per user account.
attributes:
  rationale: |
    Required to meet the scalability needs of enterprise-tier commercial customers 
    monitoring large-scale facilities.
  status: active
tags:
  priority: high
  component: backend
  concern: [scale]
parameters:
  max_streams: 50
