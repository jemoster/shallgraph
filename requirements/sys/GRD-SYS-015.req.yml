id: GRD-SYS-015
title: Requirement fields require and refinement
require: The requirement YAML schema shall define a required `require` field and an optional `refinement` field.
refinement: |
  The `require` field shall hold a single normative statement (one shall, should, or may) for the requirement ID.
  The `refinement` field shall hold supporting detail.
  A string value is Markdown detail.
  A list value is defined by GRD-SYS-021.
  The legacy `description` field shall not be accepted.
  Validation shall reject a `require` value that contains zero or more than one RFC2119 keyword.
attributes:
  rationale: |
    Separating the normative statement from supporting prose makes requirements easier to review,
    trace, and validate.
  status: active
links:
  - satisfies: GRD-SYS-001
  - satisfies: GRD-SYS-009
