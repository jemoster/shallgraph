id: GRD-VSC-006
title: Read-only rendered requirement view
require: The VSCode extension shall keep the rendered requirement view read-only.
refinement: |
  The user edits requirement text, including require, refinement, and rationale, in the YAML source of the requirement file.
attributes:
  rationale: |
    The rendered view checks the requirement against the report. Editing stays in the YAML source so there is one text to diff, review, and validate.
  status: active
links:
  - satisfies: GRD-VSC-003
