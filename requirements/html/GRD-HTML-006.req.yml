id: GRD-HTML-006
title: Link requirement references in the HTML report
require: When rendering requirement text fields in HTML, references to requirement IDs shall be rendered as hyperlinks to the referenced requirement definition within the report.
refinement: |
  This applies to requirement prose content, including require, refinement, and rationale,
  so users can navigate directly from textual references to the linked requirement.
attributes:
  status: active
links:
  - satisfies: GRD-HTML-001
