id: GRD-MD-009
title: Numbered refinement outline in Markdown
require: When `refinement` is a list, the Markdown report shall render it as a nested outline using the citation series from GRD-SYS-021.
refinement: |
  Each claim's text shall be rendered as Markdown, including parameter substitution and requirement-id links.
  A string `refinement` shall be rendered as a single Markdown block.
attributes:
  rationale: |
    Readers need a stable citation for each sub-claim in the Markdown report.
  status: active
links:
- satisfies: GRD-MD-001
- satisfies: GRD-MD-004
- satisfies: GRD-SYS-021
